ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# Security overrides: pin vulnerable transitive deps to their patched versions.
# Every target is upper-bounded to its OWN major so a security patch never
# forces an API-breaking major jump on a consumer (e.g. minimatch 3.x must keep
# brace-expansion 1.x; jsdom 29 must keep undici 7.x; vite stays on 7.x for
# vitest 4.1 / @vitejs/plugin-react 5 — see project memory).
overrides:
  '@babel/core@<=7.29.0': '>=7.29.6 <8'
  '@hono/node-server@<1.19.13': '>=1.19.13 <2'
  ajv@>=7.0.0-alpha.0 <8.18.0: '>=8.18.0 <9'
  brace-expansion@<1.1.13: '>=1.1.13 <2'
  brace-expansion@>=2.0.0 <2.0.3: '>=2.0.3 <3'
  esbuild@<=0.24.2: '>=0.25.0 <0.26'
  esbuild@>=0.27.3 <0.28.1: '>=0.28.1 <0.29'
  express-rate-limit@>=8.2.0 <8.2.2: '>=8.2.2 <9'
  fast-uri@<=3.1.1: '>=3.1.2 <4'
  flatted@<=3.4.1: '>=3.4.2 <4'
  hono@<4.12.25: '>=4.12.25 <5'
  ip-address@<=10.1.0: '>=10.1.1 <11'
  js-yaml@>=4.0.0 <=4.1.1: '>=4.2.0 <5'
  minimatch@<3.1.4: '>=3.1.4 <4'
  minimatch@>=9.0.0 <9.0.7: '>=9.0.7 <10'
  minimatch@>=10.0.0 <10.2.3: '>=10.2.3 <11'
  path-to-regexp@>=8.0.0 <8.4.0: '>=8.4.0 <9'
  picomatch@<2.3.2: '>=2.3.2 <3'
  picomatch@>=4.0.0 <4.0.4: '>=4.0.4 <5'
  postcss@<8.5.10: '>=8.5.10 <9'
  qs@>=6.7.0 <=6.15.1: '>=6.15.2 <7'
  rollup@>=4.0.0 <4.59.0: '>=4.59.0 <5'
  undici@>=7.0.0 <7.28.0: '>=7.28.0 <8'
  vite@>=7.0.0 <7.4.0: '>=7.3.6 <8'
  ws@>=8.0.0 <8.21.0: '>=8.21.0 <9'
